<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thành Đạt</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Thành Đạt</h1>
      <p class="subtitle">Trình xử lý và tối ưu hóa đa phương tiện</p>
    </header>

    <main>
      <form id="convert-form" class="card">
        <label for="url-input">Nhập liên kết:</label>
        <div class="input-group">
          <input
            type="url"
            id="url-input"
            placeholder="https://..."
            required
          >
          <button type="submit" id="submit-btn">Bắt Đầu</button>
        </div>
        <p class="hint">💡 Tệp sẽ tự động được tải xuống thiết bị sau khi xử lý xong.</p>
      </form>

      <section id="status-card" class="card hidden">
        <div class="status-header">
          <div class="status-badge" id="status-badge">Đang khởi động máy chủ...</div>
          <span id="job-info"></span>
        </div>

        <div id="file-list" class="file-list"></div>
      </section>
    </main>

    <footer>
      <p>Định dạng: 480p Baseline | Âm thanh: 44.1kHz</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
